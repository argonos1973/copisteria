<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Aleph70</title>
    <script src="/static/branding.js?v=1764787007"></script>
    <script src="/static/auto_branding.js?v=1764787007"></script>
    <link rel="stylesheet" href="/static/css/theme-consumer.css?v=FIX_FINAL_5">
    <link rel="stylesheet" href="/static/css/modales.css?v=FIX_FINAL_6">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/styles.css?v=FIX_FINAL_4">
    <link rel="stylesheet" href="/static/css/notificaciones.css">
    <link rel="stylesheet" href="/static/css/iframe-adapter.css?v=FIX_FINAL_4">
    <link rel="stylesheet" href="/static/css/modal-theme-fix.css?v=FIX_FINAL_4">
    <link rel="stylesheet" href="/static/css/admin-empresa.css">
    <link rel="stylesheet" href="/static/css/admin-empresas-tab.css?v=FIX_FINAL_4">
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-shield-alt"></i> Administración del Sistema</h1>
    </div>

    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" data-tab="usuarios">
                <i class="fas fa-users"></i> Usuarios
            </button>
            <button class="tab" data-tab="permisos">
                <i class="fas fa-key"></i> Permisos
            </button>
            <button class="tab" data-tab="empresas">
                <i class="fas fa-building"></i> Empresas
            </button>
        </div>

        <!-- Tab: Usuarios -->
        <div id="tab-usuarios" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-users"></i> Gestión de Usuarios</h2>
                </div>
                <div class="search-box" style="display: flex; gap: 10px; align-items: center; margin-bottom: 20px;">
                    <input type="text" id="buscar-usuario" placeholder="🔍 Buscar usuario..." oninput="filtrarUsuarios()" style="flex: 1;">
                    <button class="btn btn-primary" onclick="mostrarModalNuevoUsuario()" style="width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; padding: 0;" title="Crear Nuevo Usuario">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div id="tabla-usuarios">
                    <div class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando...</div>
                </div>
            </div>
        </div>


        <!-- Tab: Permisos -->
        <div id="tab-permisos" class="tab-content">
            <div class="card">
                <h2><i class="fas fa-key"></i> Matriz de Permisos</h2>
                <div class="form-group">
                    <label>Usuario:</label>
                    <select id="select-usuario-permisos" onchange="cargarPermisosUsuarioSeleccionado()">
                        <option value="">-- Seleccione --</option>
                    </select>
                </div>
                <div id="matriz-permisos"></div>
            </div>
        </div>

        <!-- Tab: Empresas -->
        <div id="tab-empresas" class="tab-content">
            <div style="text-align: center; padding: 40px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 32px;"></i>
                <p>Cargando configuración de empresa...</p>
            </div>
        </div>
    </div>

    <!-- Modal: Usuario -->
    <div id="modalUsuario" class="modal">
        <div class="modal-content" style="width: 90% !important; max-width: 800px !important; padding: 20px !important;">
            <div class="modal-header" style="padding-bottom: 10px;">
                <h2 id="modal-usuario-titulo" style="font-size: 1.3rem; margin: 0;"><i class="fas fa-user-circle"></i> Nuevo Usuario</h2>
                <span class="close" onclick="cerrarModalUsuario()">&times;</span>
            </div>
            
            <div class="modal-body" style="padding: 0 !important; overflow: hidden;">
                <div id="alert-usuario"></div>
                <form id="formUsuario" onsubmit="guardarUsuario(event)">
                    <input type="hidden" id="usuario-id">
                    <input type="hidden" id="usuario-activo" value="1">
                    <input type="hidden" id="usuario-superadmin" value="0">
                    
                    <div style="display: flex; gap: 15px; align-items: flex-start; margin-top: 10px;">
                        <!-- Columna Izquierda: Avatar (Más compacto) -->
                        <div style="flex: 0 0 120px; text-align: center; padding-top: 5px;">
                            <div style="position: relative; display: inline-block; width: 100px; height: 100px; margin-bottom: 8px;">
                                <img id="usuario-avatar-preview" src="/static/avatars/default.svg" alt="" 
                                     style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary, var(--color-primario, #3498db)); display: block; box-shadow: 0 4px 8px rgba(0,0,0,0.3);">
                            </div>
                            <div style="font-size: 11px; color: var(--text-muted, #aaa); margin-bottom: 5px; font-weight: 500;">
                                Foto de perfil
                            </div>
                        </div>

                        <!-- Columna Derecha: Campos (Espaciado reducido) -->
                        <div style="flex: 1; min-width: 0;">
                            
                            <!-- Fila 1: Usuario y Contraseña -->
                            <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 10px;">
                                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                                    <label style="color: var(--color-texto, #ddd); font-size: 12px; margin-bottom: 4px;"><i class="fas fa-user"></i> Usuario *</label>
                                    <input type="text" id="usuario-username" class="form-control" required autocomplete="username" style="width: 100%; box-sizing: border-box; height: 36px;">
                                </div>
                                
                                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                                    <label style="color: var(--color-texto, #ddd); font-size: 12px; margin-bottom: 4px;"><i class="fas fa-lock"></i> Contraseña <small>(Min 6)</small></label>
                                    <div style="position: relative; width: 100%;">
                                        <input type="password" id="usuario-password" class="form-control" autocomplete="new-password" placeholder="••••••••" style="width: 100%; padding-right: 35px; box-sizing: border-box; height: 36px;">
                                        <i class="fas fa-eye" id="toggle-password-usuario" onclick="togglePasswordUsuario()" 
                                           style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #888; z-index: 10;"></i>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Fila 2: Nombre completo -->
                            <div class="form-group" style="margin-bottom: 10px;">
                                <label style="color: var(--color-texto, #ddd); font-size: 12px; margin-bottom: 4px;"><i class="fas fa-id-card"></i> Nombre completo *</label>
                                <input type="text" id="usuario-nombre" class="form-control" required style="width: 100%; box-sizing: border-box; height: 36px;">
                            </div>
                            
                            <!-- Fila 3: Email y Teléfono -->
                            <div style="display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 10px;">
                                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                                    <label style="color: var(--color-texto, #ddd); font-size: 12px; margin-bottom: 4px;"><i class="fas fa-envelope"></i> Email</label>
                                    <input type="email" id="usuario-email" class="form-control" autocomplete="email" style="width: 100%; box-sizing: border-box; height: 36px;">
                                </div>
                                <div class="form-group" style="flex: 1; min-width: 200px; margin-bottom: 0;">
                                    <label style="color: var(--color-texto, #ddd); font-size: 12px; margin-bottom: 4px;"><i class="fas fa-phone"></i> Teléfono</label>
                                    <input type="tel" id="usuario-telefono" class="form-control" style="width: 100%; box-sizing: border-box; height: 36px;">
                                </div>
                            </div>

                            <!-- Fila 4: Rol -->
                            <div class="form-group" style="margin-bottom: 8px;">
                                <label style="color: var(--color-texto, #ddd); font-size: 12px; margin-bottom: 4px;"><i class="fas fa-user-shield"></i> Rol y Permisos *</label>
                                <select id="usuario-rol" class="form-control" required style="width: 100%; box-sizing: border-box; height: 36px;">
                                    <option value="admin">Administrador - Acceso total</option>
                                    <option value="editor">Editor - Sin acceso a Administración</option>
                                    <option value="consultor">Consultor - Solo lectura</option>
                                </select>
                                <small style="font-size: 10px; color: var(--text-muted, #aaa); display: block; margin-top: 3px;">
                                    Define el nivel de acceso general al sistema.
                                </small>
                            </div>
                        </div>
                    </div>
                    
                    <div class="modal-footer" style="margin-top: 15px; padding-top: 0; border-top: none; padding-bottom: 0;">
                        <button type="submit" class="btn btn-modal-save w-100" style="height: 40px; display: flex; align-items: center; justify-content: center;">Guardar Usuario</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Cargar plantillas dinámicamente -->
    <script src="/static/plantillas.js?v=1763897790"></script>
    <script type="module">
        import { mostrarNotificacion } from '/static/notificaciones.js';
        window.mostrarNotificacion = mostrarNotificacion;
    </script>
    <script src="/static/nif_cif_validator.js?v=1763897790"></script>
    <script src="/static/cp_validator.js?v=1763897790"></script>
    <!-- Session Manager requerido para validar usuario actual -->
    <script src="/static/session_manager.js?v=FIX_SESSION"></script>
    <script src="/static/admin.js?v=FIX_FINAL"></script>
    
    <!-- Inicializar plantillas al cargar -->
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await cargarPlantillas();
            // console.log('✅ Plantillas cargadas y disponibles en window.plantillasColores');
        });
        
        // Cerrar modal al hacer click fuera
        window.onclick = function(event) {
            const modal = document.getElementById('modalUsuario');
            if (event.target === modal) {
                cerrarModalUsuario();
            }
        };
        
        // Toggle visibilidad de contraseña
        window.togglePasswordUsuario = function() {
            const input = document.getElementById('usuario-password');
            const icon = document.getElementById('toggle-password-usuario');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        };
    </script>
    <script src="/static/branding.js?v=1764787007"></script>
    <script src="/static/auto_branding.js?v=1764787007"></script>
    
    <!-- Contenedor para notificaciones -->
    <div id="notificaciones-contenedor"></div>
    
</body>
</html>
