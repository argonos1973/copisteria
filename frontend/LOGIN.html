<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aleph70</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <!-- SessionManager para Cloudflare -->
    <script src="/static/session_manager.js?v=1763897790"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // Limpieza proactiva de sesión al cargar login
        try {
            localStorage.removeItem('aleph70_session');
            sessionStorage.clear();
            // Asegurar limpieza si SessionManager ya se cargó
            if(window.sessionManager) window.sessionManager.clearSession();
        } catch(e) { console.error('Error limpiando sesión:', e); }
    </script>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #000000;
            --primary-2: #333333;
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(15, 23, 42, 0.10);
            --card: rgba(255, 255, 255, 0.70);
            --font-display: 'Anton', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background: transparent;
        }

        .login-container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow:
                0 18px 44px rgba(2, 6, 23, 0.10);
            border: 1px solid rgba(15, 23, 42, 0.10);
            overflow: hidden;
            width: 720px;
            max-width: 90%;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: row;
            align-items: stretch;
        }

        .login-header {
            background: #ffffff;
            color: var(--text);
            padding: 18px 16px;
            text-align: center;
            border-bottom: none;
            flex: 0 0 55%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(15, 23, 42, 0.08);
        }

        .login-logo {
            width: 100%;
            height: auto;
            margin: 0 auto;
            display: block;
            max-width: none;
            max-height: 500px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06));
            transform: scale(1.25);
            transform-origin: center center;
        }

        .login-header h1,
        .login-header p {
            display: none;
        }

        .login-header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .login-header p {
            color: #666;
            font-size: 15px;
            font-weight: 400;
        }

        .login-body {
            padding: 28px;
            background: transparent;
            flex: 1;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #ffffff;
            color: var(--text);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: rgba(79, 70, 229, 0.55);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .btn-login {
            width: 100%;
            max-width: 280px;
            padding: 12px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-family: var(--font-display);
            font-weight: 400;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 18px rgba(2, 6, 23, 0.12);
            display: block;
            margin: 0 auto;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(2, 6, 23, 0.16);
            background: #0f172a;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #000000;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .version-info {
            text-align: center;
            margin-top: 18px;
            color: #9ca3af;
            font-size: 11px;
            font-weight: 500;
        }

        #empresa-selector {
            display: none;
        }

        .empresa-item {
            padding: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 16px;
            background: #fff;
        }

        .empresa-item:hover {
            border-color: #6366f1;
            background: #f5f7ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .empresa-logo {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            background: #f3f4f6;
        }

        .empresa-nombre {
            font-weight: 600;
            color: #1f2937;
            font-size: 15px;
        }

        .forgot-password {
            text-align: center;
            margin-top: 10px;
        }

        .forgot-password a {
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            font-weight: 500;
        }

        .forgot-password a:hover {
            color: var(--primary);
        }

        @media (max-width: 900px) {
            .login-container {
                width: 420px;
                max-width: 90%;
                flex-direction: column;
            }

            .login-header {
                padding: 18px 18px 12px;
                text-align: center;
                flex: 0 0 auto;
                align-items: center;
                justify-content: center;
                border-right: none;
                border-bottom: 1px solid rgba(15, 23, 42, 0.08);
            }

            .login-logo {
                margin: 0 auto 14px;
                width: clamp(280px, 74vw, 520px);
                max-height: 220px;
            }

            .login-body {
                padding: 26px 32px 36px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <svg viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aleph70" class="login-logo">
                <g style="text-rendering:geometricPrecision">
                    <text x="12" y="64" font-family="Anton, Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="74" font-weight="400" fill="#e5e7eb" letter-spacing="-1">A</text>
                    <text x="34" y="64" font-family="Anton, Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="74" font-weight="400" fill="#0b0f19" letter-spacing="-1">A70</text>
                </g>
            </svg>
            <h1>Aleph70</h1>
            <p>Iniciar sesión</p>
        </div>
        
        <div class="login-body">
            <div id="alert-container" class="alert"></div>
            
            <!-- Paso 1: Credenciales -->
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" 
                           placeholder="Introduce tu usuario" required autofocus
                           autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" 
                           placeholder="Introduce tu contraseña" required
                           autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-login" id="btn-siguiente">
                    Aceptar
                </button>
                
                <div class="forgot-password">
                    <a href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
                </div>

                <!-- Separador -->
                <div style="margin: 16px 0 10px; text-align: center; border-top: 1px solid #e0e0e0; position: relative;">
                    <span style="background: #fff; padding: 0 10px; position: relative; top: -10px; color: #666; font-size: 13px;">O inicia sesión con</span>
                </div>

                <!-- Contenedor botón Google -->
                <div style="display: flex; justify-content: center;" id="google-btn-container"></div>
            </form>
            
            <!-- Paso 2: Selector de empresa (oculto inicialmente) -->
            <div id="empresa-selector">
                <h3 style="margin-bottom: 20px; color: #000000;">Selecciona una empresa:</h3>
                <div id="empresas-lista"></div>
                <button type="button" class="btn-login" onclick="volverLogin()" 
                        style="margin-top: 10px;">
                    ← Volver
                </button>
            </div>
            
            <div class="loading-spinner" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #000000;">Iniciando sesión...</p>
            </div>
            
            <div class="version-info">
                v1.0.0<br>
                © 2025 Aleph70
            </div>
        </div>
    </div>

    <script>
        let currentUsername = '';
        let currentPassword = '';

        // Callback Google Sign-Up
        async function handleGoogleCredentialResponse(response) {
            mostrarCargando(true);
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token: response.credential })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    mostrarAlerta(`✅ Bienvenido ${data.usuario || 'Usuario Google'}`, 'success');
                    
                    // Esperar y redirigir
                    setTimeout(() => {
                        window.location.href = "/api/auth/app";
                    }, 1500);
                } else {
                    mostrarAlerta(data.error || 'Error al iniciar sesión con Google', 'error');
                    mostrarCargando(false);
                }
            } catch (e) {
                console.error(e);
                mostrarAlerta('Error de conexión', 'error');
                mostrarCargando(false);
            }
        }

        // Inicializar Google Auth
        async function initGoogleAuth() {
            try {
                const res = await fetch('/api/auth/config');
                if(res.ok) {
                    const config = await res.json();
                    if(config.google_client_id) {
                        console.log('Inicializando Google Auth con:', config.google_client_id);
                        google.accounts.id.initialize({
                            client_id: config.google_client_id,
                            callback: handleGoogleCredentialResponse,
                            context: 'signin',
                            ux_mode: 'popup',
                            auto_select: false
                        });
                        google.accounts.id.renderButton(
                            document.getElementById("google-btn-container"),
                            { theme: "outline", size: "large", width: 280, text: "signin_with" }
                        );
                    } else {
                        console.log('Google Auth no configurado.');
                    }
                }
            } catch(e) { console.error('Error init google', e); }
        }

        window.onload = function() {
            initGoogleAuth();
        };

        // Manejo del formulario de login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            currentUsername = document.getElementById('username').value.trim();
            currentPassword = document.getElementById('password').value;
            
            if (!currentUsername || !currentPassword) {
                mostrarAlerta('Por favor completa todos los campos', 'error');
                return;
            }
            
            mostrarCargando(true);
            
            try {
                // Obtener empresas del usuario
                const response = await fetch(`/api/auth/empresas/${currentUsername}`);
                const empresas = await response.json();
                
                if (empresas.length === 0) {
                    // Usuario sin empresas asignadas - permitir acceso limitado
                    mostrarAlerta('Usuario sin empresas asignadas', 'warning');
                    // Login sin empresa - acceso limitado solo a gestión
                    await realizarLogin(null);
                } else if (empresas.length === 1) {
                    // Solo una empresa, login directo
                    await realizarLogin(empresas[0].codigo);
                } else {
                    // Múltiples empresas, mostrar selector
                    mostrarSelectorEmpresas(empresas);
                }
                
                mostrarCargando(false);
                
            } catch (error) {
                // console.error('Error:', error);
                mostrarAlerta('Error obteniendo empresas', 'error');
                mostrarCargando(false);
            }
        });

        async function mostrarSelectorEmpresas(empresas) {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('empresa-selector').style.display = 'block';
            
            const lista = document.getElementById('empresas-lista');
            lista.innerHTML = '';
            
            // Cargar branding de cada empresa
            for (const empresa of empresas) {
                const item = document.createElement('div');
                item.className = 'empresa-item';
                item.dataset.empresaCodigo = empresa.codigo;
                
                // Obtener branding de la empresa
                try {
                    const brandingResponse = await fetch(`/api/auth/branding-preview/${empresa.codigo}`);
                    if (brandingResponse.ok) {
                        const branding = await brandingResponse.json();
                        empresa.colores = branding.colores;
                    }
                } catch (error) {
                    // console.error(`Error cargando branding de ${empresa.codigo}:`, error);
                }
                
                item.onclick = () => realizarLogin(empresa.codigo);
                
                // Al hacer hover, aplicar colores de la empresa
                item.onmouseenter = () => aplicarColoresEmpresa(empresa);
                
                item.innerHTML = `
                    <img src="${empresa.logo}" class="empresa-logo" 
                         onerror="this.src='/static/logos/default_header.png'">
                    <div class="empresa-nombre">${empresa.nombre}</div>
                `;
                
                lista.appendChild(item);
            }
        }
        
        function aplicarColoresEmpresa(empresa) {
            if (!empresa.colores) return;
            
            const container = document.querySelector('.login-container');
            const header = document.querySelector('.login-header');
            const body = document.querySelector('.login-body');
            
            // Aplicar colores de la empresa
            container.style.background = empresa.colores.app_bg || '#ffffff';
            container.style.borderColor = empresa.colores.primario || '#000000';
            header.style.background = empresa.colores.header_bg || empresa.colores.primario || '#ffffff';
            header.style.color = empresa.colores.header_text || '#000000';
            header.querySelector('h1').style.color = empresa.colores.header_text || '#000000';
            header.querySelector('p').style.color = empresa.colores.header_text || '#333333';
            body.style.background = empresa.colores.secundario || empresa.colores.app_bg || '#ffffff';
            
            // Ajustar color de texto según luminosidad
            const luminance = getLuminance(empresa.colores.app_bg || '#ffffff');
            const textColor = luminance > 0.5 ? '#000000' : '#ffffff';
            body.style.color = textColor;
            
            // Actualizar items de empresa
            document.querySelectorAll('.empresa-item').forEach(item => {
                item.style.borderColor = empresa.colores.primario || '#000000';
                item.style.background = empresa.colores.secundario || '#ffffff';
                item.style.color = textColor;
            });
        }
        
        function getLuminance(color) {
            // Convertir hex a RGB
            let r, g, b;
            if (color.startsWith('#')) {
                const hex = color.replace('#', '');
                r = parseInt(hex.substring(0, 2), 16);
                g = parseInt(hex.substring(2, 4), 16);
                b = parseInt(hex.substring(4, 6), 16);
            } else {
                return 0.5; // default
            }
            // Calcular luminosidad
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }

        async function realizarLogin(empresaCodigo) {
            mostrarCargando(true);
            ocultarAlerta();
            
            // DEBUG: Mostrar datos que se envían
            const loginData = {
                username: currentUsername,
                password: currentPassword,
                empresa: empresaCodigo
            };
            // console.log('🔍 DEBUG - Datos de login:', {
            //     username: loginData.username,
            //     password: '***' + loginData.password.slice(-3),
            //     empresa: loginData.empresa,
            //     username_length: loginData.username.length,
            //     password_length: loginData.password.length
            // });
            
            try {
                // Usar SessionManager para login (compatible con Cloudflare)
                const result = await window.sessionManager.login(
                    loginData.username,
                    loginData.password,
                    loginData.empresa
                );
                
                if (result.success) {
                    mostrarAlerta(`✅ Bienvenido ${result.data.usuario}`, 'success');
                    
                    // Esperar 1 segundo para que la sesión se guarde
                    setTimeout(() => {
                        // Todos los usuarios van a la aplicación principal
                        window.location.href = "/api/auth/app";
                    }, 1500);
                } else {
                    mostrarAlerta(result.error || 'Error en el login', 'error');
                    volverLogin();
                }
                
            } catch (error) {
                // console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
                volverLogin();
            } finally {
                mostrarCargando(false);
            }
        }

        function volverLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('empresa-selector').style.display = 'none';
            document.getElementById('password').value = '';
            ocultarAlerta();
        }

        function mostrarAlerta(mensaje, tipo) {
            const alert = document.getElementById('alert-container');
            alert.textContent = mensaje;
            alert.className = `alert alert-${tipo}`;
            alert.style.display = 'block';
        }

        function ocultarAlerta() {
            document.getElementById('alert-container').style.display = 'none';
        }

        function mostrarCargando(mostrar) {
            document.getElementById('loading').style.display = mostrar ? 'block' : 'none';
            document.getElementById('btn-siguiente').disabled = mostrar;
        }

        // Enter en password también envía el formulario
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });

    </script>
    <script src="/static/branding.js?v=1764787007"></script>
    <script src="/static/auto_branding.js?v=1764787007"></script>
</body>
</html>
