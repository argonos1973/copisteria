<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/static/session_manager.js?v=1763897790"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturas Recibidas</title>
    <script src="/static/branding.js?v=1764787007"></script>
    <script src="/static/auto_branding.js?v=1764787007"></script>
    <script src="/static/nif_cif_validator.js?v=1763897790"></script>
    <script src="/static/cp_validator.js?v=1763897790"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../static/css/page_header.css?v=1763897790">
    <link rel="stylesheet" href="/static/css/theme-consumer.css?v=1763897790">
    <link rel="stylesheet" href="../static/css/styles.css?v=FIX_FINAL_5">
    <link rel="stylesheet" href="../static/css/notificaciones.css?v=1763897790">
    <link rel="stylesheet" href="../static/css/footer.css?v=1763897790">
    <link rel="stylesheet" href="../static/css/modales.css?v=FIX_NUEVA_FACTURA_LAYOUT_20251214AA">
    <style>
      /* Vista Facturas Recibidas: layout a pantalla completa */
      .facturas-recibidas-page { padding-bottom: 0 !important; }
      .facturas-recibidas-page {
        background: var(--bg, var(--app-bg, #f5f5f5));
        color: var(--text, var(--text-primary, #333));
      }
      .container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 96px);
        min-height: 100vh;
        box-sizing: border-box;
      }
      .facturas-recibidas-page .pagination { margin-bottom: 8px !important; }
      .facturas-recibidas-page .container { padding-bottom: 0 !important; }
      .table-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--bg-elevated, var(--bg, #fff));
        border: 1px solid var(--border, var(--border-color, #e0e0e0));
        border-radius: 8px;
        overflow: hidden;
      }
      .table-responsive {
        flex: 1;
        max-height: none !important;
        height: 100% !important;
        overflow-y: auto;
        background: var(--bg-elevated, var(--bg, #fff));
      }
      .form-inline { margin: 4px 0; }
      .pagination { margin-top: 6px; }
      .facturas-recibidas-page .pagination {
        border-color: var(--border, var(--border-color, #e0e0e0)) !important;
        background: var(--bg-elevated, var(--card-bg, #fff));
        color: var(--text, var(--text-primary, #333));
      }
      
      /* Alertas en la parte superior */
      .alertas-container {
        margin: 8px 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .alerta {
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .alerta.roja {
        background: var(--alert-danger-bg, #fee);
        border-left: 4px solid var(--alert-danger-border, #d32f2f);
        color: var(--alert-danger-text, #c62828);
      }
      .alerta.amarilla {
        background: var(--alert-warning-bg, #fffbf0);
        border-left: 4px solid var(--alert-warning-border, #f57c00);
        color: var(--alert-warning-text, #e65100);
      }
      .alerta.naranja {
        background: var(--alert-info-bg, #fff3e0);
        border-left: 4px solid var(--alert-info-border, #ff9800);
        color: var(--alert-info-text, #e65100);
      }
      .alerta a {
        color: inherit;
        text-decoration: underline;
        font-weight: 600;
        cursor: pointer;
      }
      
      /* Filas clicables */
      #facturasTable tbody tr {
        transition: background-color 0.2s ease;
      }
      #facturasTable tbody tr:hover {
        background-color: var(--table-row-hover, rgba(0, 123, 255, 0.05)) !important;
        box-shadow: 0 2px 4px var(--shadow, rgba(0,0,0,0.1));
      }
      
      /* Resumen de importes */
      .resumen-importes {
        display: flex;
        gap: 12px;
        margin: 8px 0;
        flex-wrap: wrap;
      }
      .resumen-card {
        flex: 1;
        min-width: 150px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid var(--border, var(--border-color, #e0e0e0)) !important;
        background: var(--bg-elevated, var(--card-bg, #fff)) !important;
      }
      .resumen-card .label {
        font-size: 11px;
        color: var(--text-muted, var(--text-secondary, #666)) !important;
        text-transform: uppercase;
        margin-bottom: 4px;
      }
      .resumen-card .valor {
        font-size: 20px;
        font-weight: 600;
        color: var(--text, var(--text-primary, #333)) !important;
      }
      
      /* Iconos de estado en tabla */
      .estado-icon {
        display: inline-block;
        width: 20px;
        text-align: center;
        font-size: 16px;
      }
      
      /* Botones de acción compactos */
      .btn-action {
        padding: 4px 8px;
        font-size: 12px;
        margin: 0 2px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-action:hover {
        opacity: 0.8;
        transform: scale(1.05);
      }
      .btn-action.btn-primary {
        background: var(--primary, var(--button-bg, #007bff));
        color: var(--button-text, #fff);
      }
      .btn-action.btn-success {
        background: var(--success, #28a745);
        color: var(--button-text, #fff);
      }
      .btn-action.btn-info {
        background: var(--info, #17a2b8);
        color: var(--button-text, #fff);
      }
      .btn-action.btn-warning {
        background: var(--warning, #ffc107);
        color: var(--text, #333);
      }
      .btn-action.btn-danger {
        background: var(--danger, #dc3545) !important;
        color: var(--button-text, #fff) !important;
        font-size: 18px !important;
        font-weight: bold !important;
        line-height: 1 !important;
        padding: 4px 10px !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        min-width: 32px !important;
      }
      .btn-action.btn-danger span {
        display: block !important;
        color: inherit !important;
      }
      .btn-action i {
        color: inherit !important;
        font-size: 14px;
      }
      /* Estilos de tabla mejorados */
      #facturasTable {
        width: 100%;
        border-collapse: collapse;
        /* table-layout: fixed; NO usar fixed si no definimos ancho para todas, mejor dejar auto con min-widths */
      }

      #facturasTable thead th {
        background: var(--table-header-bg, var(--bg-elevated, var(--bg, #f0f0f0)));
        color: var(--table-header-text, var(--text, #333));
        border-bottom: 1px solid var(--border, var(--border-color, #e0e0e0));
      }

      #facturasTable tbody {
        background: var(--bg-elevated, var(--bg, #fff));
      }

      #facturasTable tbody tr {
        background: var(--table-row-bg, transparent);
        color: var(--text, var(--text-primary, #333));
      }
      
      #facturasTable th, #facturasTable td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border, var(--border-color, #e0e0e0));
        vertical-align: middle;
      }
    </style>
</head>
<body class="facturas-recibidas-page">
    <div class="container">
        <!-- Header -->
        <div class="page-header">
            <h1><i class="fas fa-file-import"></i> Facturas Recibidas</h1>
        </div>

        <!-- Alertas (ocultas por defecto, se muestran con JS) -->
        <div class="alertas-container" id="alertasContainer" style="display: none;">
            <!-- Se llenan dinámicamente con JS -->
        </div>

        <!-- Resumen de importes -->
        <div class="resumen-importes">
            <div class="resumen-card">
                <div class="label">Total</div>
                <div class="valor" id="resumenTotal">0,00€</div>
            </div>
            <div class="resumen-card">
                <div class="label">Pendientes</div>
                <div class="valor" id="resumenPendiente">0,00€</div>
            </div>
            <div class="resumen-card">
                <div class="label">Pagadas</div>
                <div class="valor" id="resumenPagado">0,00€</div>
            </div>
            <div class="resumen-card">
                <div class="label">Vencidas</div>
                <div class="valor" id="resumenVencido">0,00€</div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="form-inline">
            <div class="form-group">
                <label for="proveedorFilter">Proveedor:</label>
                <select id="proveedorFilter">
                    <option value="todos">Todos</option>
                    <!-- Se llenan dinámicamente -->
                </select>
            </div>
            <div class="form-group">
                <label for="trimestreFilter">Periodo:</label>
                <select id="trimestreFilter" style="min-width: 150px;">
                    <option value="actual" selected>Trimestre Actual</option>
                    <option value="anterior">Trimestre Anterior</option>
                    <option value="anio_actual">Año Actual</option>
                    <option value="anio_anterior">Año Anterior</option>
                    <option value="1T">1er Trimestre</option>
                    <option value="2T">2do Trimestre</option>
                    <option value="3T">3er Trimestre</option>
                    <option value="4T">4to Trimestre</option>
                    <option value="todos">Todo el Histórico</option>
                </select>
            </div>
            <div class="form-group" id="anioContainer" style="display:none;">
                 <label for="anioFilter">Año:</label>
                 <select id="anioFilter" style="width: 80px;">
                     <!-- Se llena con JS -->
                 </select>
            </div>
            <div class="form-group">
                <label for="busquedaFilter">Buscar:</label>
                <div style="position: relative; display: inline-block;">
                    <input type="text" id="busquedaFilter" placeholder="Nº factura, concepto...">
                    <span id="searchingIndicator" style="display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); color: var(--warning-color, #ffc107);">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </div>
            </div>
            <div class="form-group" style="margin-left:auto;">
                <button id="btnNuevaFactura" class="btn-action btn-primary" type="button" title="Nueva">
                    <i class="fas fa-plus"></i> Nueva
                </button>
            </div>
        </div>

        <!-- Paginación superior -->
        <div class="pagination" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;margin-bottom:4px;padding:6px 8px;border:1px solid var(--border-color, #e0e0e0);border-radius:8px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <button id="prevPage" class="btn btn-secondary" style="padding:4px 8px;font-size:12px;">⟨</button>
            <span id="pageInfo">Página 1 de 1</span>
            <button id="nextPage" class="btn btn-secondary" style="padding:4px 8px;font-size:12px;">⟩</button>
          </div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
            <label>Por página:
              <select id="perPage" style="padding:2px 6px;font-size:12px;">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
          </div>
        </div>

        <!-- Tabla de facturas -->
        <div class="table-container">
            <div class="table-responsive">
                <table id="facturasTable">
                    <thead>
                        <tr>
                            <th>Proveedor</th>
                            <th style="width: 100px;">NIF</th>
                            <th style="width: 100px;">Nº Factura</th>
                            <th style="width: 100px;">Fecha</th>
                            <th style="width: 100px;">Venc.</th>
                            <th style="text-align: right; width: 100px;">Base</th>
                            <th style="text-align: right; width: 100px;">IVA</th>
                            <th style="text-align: right; width: 110px;">Total</th>
                            <th style="width: 80px; text-align: center;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="facturasBody">
                        <tr>
                            <td colspan="9" style="text-align: center; padding: 40px;">
                                <i class="fas fa-spinner fa-spin"></i> Cargando facturas...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>


    <!-- Notificaciones (reutilizando tu sistema) -->
    <div id="notificaciones"></div>

    <!-- Incluir Modales -->
    <div id="modales-container"></div>

    <!-- Scripts -->
    <script>
        // Cargar modales dinámicamente
        fetch('/MODALES_FACTURAS_RECIBIDAS.html?v=FIX_FINAL_6')
            .then(response => response.text())
            .then(html => {
                document.getElementById('modales-container').innerHTML = html;
                try {
                    const hasNuevaArchivo = html.includes('id="nueva-archivo"');
                    const el = document.getElementById('nueva-archivo');
                    console.log('[Facturas Recibidas][MODALES] HTML incluye #nueva-archivo:', hasNuevaArchivo);
                    console.log('[Facturas Recibidas][MODALES] DOM tiene #nueva-archivo:', !!el);
                } catch (e) {
                    console.warn('[Facturas Recibidas][MODALES] No se pudo verificar #nueva-archivo', e);
                }
            })
            .catch(error => console.error('Error cargando modales:', error));
    </script>
    <script type="module" src="/static/facturas_recibidas.js?v=FIX_PANEL_NUEVA_FACTURA_COLLAPSED_20251214E"></script>
</body>
</html>
