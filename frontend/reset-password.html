<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Aleph70</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-2: #6366f1;
            --text: #0f172a;
            --muted: #64748b;
            --border: rgba(15, 23, 42, 0.10);
            --card: rgba(255, 255, 255, 0.70);
            --font-display: 'Anton', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text);
        }

        body::before,
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background: transparent;
        }

        .container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow:
                0 18px 44px rgba(2, 6, 23, 0.10),
                0 2px 0 rgba(255, 255, 255, 0.6) inset;
            border: 1px solid rgba(15, 23, 42, 0.10);
            overflow: hidden;
            width: 520px;
            max-width: 90%;
        }

        .header {
            background: #0b1220;
            color: #ffffff;
            padding: 26px;
            text-align: center;
            border-bottom: none;
        }

        .logo {
            width: 320px;
            max-width: 92%;
            height: auto;
            margin: 0 auto 12px;
            display: block;
            filter: drop-shadow(0 14px 26px rgba(0,0,0,0.25));
        }

        .header h1 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffffff;
            font-weight: 700;
        }

        .header p {
            color: rgba(255, 255, 255, 0.72);
            font-size: 14px;
        }

        .body {
            padding: 26px;
            background: transparent;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.75);
            color: var(--text);
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(79, 70, 229, 0.55);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .password-requirements {
            font-size: 12px;
            color: var(--muted);
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            max-width: 280px;
            padding: 12px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-family: var(--font-display);
            font-weight: 400;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 18px rgba(2, 6, 23, 0.12);
            display: block;
            margin: 0 auto;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(2, 6, 23, 0.16);
            background: #0f172a;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .alert-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #666;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .success-message i {
            font-size: 60px;
            color: #3c3;
            margin-bottom: 20px;
        }

        .success-message h2 {
            color: var(--text);
            margin-bottom: 10px;
        }

        .success-message p {
            color: var(--muted);
            margin-bottom: 20px;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <svg viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aleph70" class="logo">
                <g style="text-rendering:geometricPrecision">
                    <text x="12" y="64" font-family="Anton, Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="74" font-weight="400" fill="#334155" letter-spacing="-1">A</text>
                    <text x="34" y="64" font-family="Anton, Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="74" font-weight="400" fill="#ffffff" letter-spacing="-1">A70</text>
                </g>
            </svg>
            <h1><i class="fas fa-key"></i> Restablecer Contraseña</h1>
            <p id="user-info"></p>
        </div>
        
        <div class="body">
            <div id="alert-container" class="alert"></div>
            
            <!-- Formulario de nueva contraseña -->
            <form id="reset-form">
                <!-- Campo username oculto para accesibilidad -->
                <input type="text" autocomplete="username" style="display:none" aria-hidden="true">

                <div class="form-group">
                    <label for="password">Nueva Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" 
                           placeholder="Introduce tu nueva contraseña" required>
                    <div class="password-requirements">
                        Mínimo 6 caracteres
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" 
                           placeholder="Confirma tu nueva contraseña" required>
                </div>
                
                <button type="submit" class="btn" id="btn-submit">
                    Restablecer Contraseña
                </button>
            </form>
            
            <!-- Mensaje de éxito -->
            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i>
                <h2>¡Contraseña Actualizada!</h2>
                <p>Tu contraseña ha sido restablecida correctamente.</p>
                <a href="/LOGIN.html" class="btn">Ir al Login</a>
            </div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: var(--text);">Procesando...</p>
            </div>
            
            <div class="back-link">
                <a href="/LOGIN.html">← Volver al Login</a>
            </div>
        </div>
    </div>

    <script>
        let token = '';

        // Obtener token de la URL
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token');

        if (!token) {
            mostrarAlerta('Token no válido. Solicita un nuevo enlace de recuperación.', 'error');
            document.getElementById('reset-form').style.display = 'none';
        } else {
            // Validar token al cargar
            validarToken();
        }

        async function validarToken() {
            try {
                const response = await fetch(`/api/auth/validate-reset-token?token=${token}`);
                const data = await response.json();

                if (data.valid) {
                    document.getElementById('user-info').textContent = `Usuario: ${data.username}`;
                } else {
                    mostrarAlerta(data.error || 'Token inválido', 'error');
                    document.getElementById('reset-form').style.display = 'none';
                }
            } catch (error) {
                // console.error('Error:', error);
                mostrarAlerta('Error validando token', 'error');
                document.getElementById('reset-form').style.display = 'none';
            }
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                mostrarAlerta('Las contraseñas no coinciden', 'error');
                return;
            }

            if (password.length < 6) {
                mostrarAlerta('La contraseña debe tener al menos 6 caracteres', 'error');
                return;
            }

            mostrarCargando(true);
            ocultarAlerta();

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Mostrar mensaje de éxito
                    document.getElementById('reset-form').style.display = 'none';
                    document.getElementById('success-message').style.display = 'block';
                } else {
                    mostrarAlerta(data.error || 'Error restableciendo contraseña', 'error');
                }

            } catch (error) {
                // console.error('Error:', error);
                mostrarAlerta('Error de conexión con el servidor', 'error');
            } finally {
                mostrarCargando(false);
            }
        });

        function mostrarAlerta(mensaje, tipo) {
            const alert = document.getElementById('alert-container');
            alert.textContent = mensaje;
            alert.className = `alert alert-${tipo}`;
            alert.style.display = 'block';
        }

        function ocultarAlerta() {
            document.getElementById('alert-container').style.display = 'none';
        }

        function mostrarCargando(mostrar) {
            document.getElementById('loading').style.display = mostrar ? 'block' : 'none';
            document.getElementById('btn-submit').disabled = mostrar;
        }
    </script>
</body>
</html>
