<!-- Version: 1761152613 -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS base que usa variables CSS generadas por applyTheme -->
    <link rel="stylesheet" href="/static/css/theme-base.css?v=1763897790">
    <!-- CSS que consume las variables del tema y las aplica a la UI -->
    <link rel="stylesheet" href="/static/css/theme-consumer.css?v=1763897790">
    <link rel="stylesheet" href="/static/css/modales.css?v=FIX_PERFIL_BORDER">
    <link rel="stylesheet" href="/static/css/styles.css?v=1763897790">
    <link rel="stylesheet" href="/static/css/notificaciones.css">
    <link rel="stylesheet" href="/static/css/footer.css">
    <link rel="stylesheet" href="/static/css/page_header.css">
    <link rel="stylesheet" href="/static/css/app_private.css?v=FIX_BLUR">
    <!-- CSS inline eliminado - movido a app_private.css -->
</head>
<body>
    <div class="layout-container">
        <nav class="menu">
            <div class="logo-container" style="padding: 1rem; margin-bottom: 0.5rem; text-align: center;">
                <img id="logo-empresa" src="/static/logos/default_header.png" alt="Logo" style="max-width: 200px; height: auto;">
            </div>
            
            <!-- Iconos de notificaciones y cerrar sesión -->
            <div style="padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 15px;">
                <div id="notificaciones-icon" style="position: relative; cursor: pointer;">
                    <i class="fas fa-bell" style="font-size: 20px; color: white;"></i>
                    <span id="notificaciones-badge" style="display: none; position: absolute; top: -8px; right: -8px; background: #e74c3c; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 11px; font-weight: bold; text-align: center; line-height: 20px;">0</span>
                </div>
                <div onclick="cerrarSesion()" style="cursor: pointer;" title="Cerrar Sesión">
                    <i class="fas fa-sign-out-alt" style="font-size: 20px; color: white;"></i>
                </div>
            </div>
            
            <!-- Información de sesión -->
            <div style="padding: 0.5rem 1rem; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 1rem;">
                <div id="user-profile-link" style="color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 5px; cursor: pointer; display: flex; align-items: flex-start; gap: 10px; padding: 4px; border-radius: 4px;" 
                     onmouseover="this.style.background='rgba(255,255,255,0.1)'"
                     onmouseout="this.style.background='transparent'"
                     title="Click para ver tu perfil">
                    <img id="menu-usuario-avatar" src="/static/avatars/default.svg" alt="" 
                         style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.3); flex-shrink: 0; display: block;">
                    <span id="menu-usuario-nombre" style="flex: 1; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 9px;">Usuario</span>
                </div>
                <div style="color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px;">
                    <div style="width: 32px; flex-shrink: 0; display: flex; justify-content: center;">
                        <i class="fas fa-building" style="font-size: 12px;"></i>
                    </div>
                    <span id="menu-empresa-nombre" style="line-height: 1.4;">Empresa</span>
                </div>
                <div style="color: rgba(255,255,255,0.5); font-size: 11px; display: flex; align-items: center; gap: 8px;">
                    <div style="width: 32px; flex-shrink: 0; display: flex; justify-content: center;">
                        <i class="fas fa-clock" style="font-size: 11px;"></i>
                    </div>
                    <span>Último acceso: <span id="menu-ultimo-acceso">--:--</span></span>
                </div>
            </div>
            
            <ul class="menu-list">
                <!-- El menú se cargará dinámicamente según permisos -->
                <li class="menu-loading">
                    <i class="fas fa-spinner fa-spin"></i> Cargando menú...
                </li>
            </ul>
            
            <!-- Versión de la aplicación -->
            <div id="menu-version" style="padding: 0.5rem 1rem; border-top: 1px solid rgba(255,255,255,0.1); margin-top: auto; text-align: left;">
                <div style="color: rgba(255,255,255,0.5); font-size: 10px;">
                    <i class="fas fa-code-branch" style="margin-right: 5px;"></i>
                    <span id="app-version">v1.0.4</span>
                </div>
            </div>
        </nav>
        
        <div class="content-container" style="flex-grow: 1; height: 100vh; overflow: hidden; position: relative; display: flex; flex-direction: column;">
            <!-- Barra superior para toggle y breadcrumbs -->
            <div class="app-top-bar">
                <button id="sidebar-toggle" class="sidebar-toggle-btn" title="Ocultar/Mostrar Menú">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            
            <div style="flex: 1; position: relative; overflow: hidden;">
                <iframe id="content-frame" name="content-frame" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
            </div>
        </div>
    </div>

    <!-- Panel de notificaciones -->
    <div id="notificaciones-panel">
        <div class="notif-header">
            <div style="display: flex; align-items: center; gap: 10px; flex: 1;">
                <label id="select-all-container" style="display: none; align-items: center; gap: 5px; cursor: pointer; font-size: 14px;">
                    <input type="checkbox" id="select-all-notif" onchange="toggleSeleccionarTodas()" style="cursor: pointer; width: 16px; height: 16px;">
                    <span>Todas</span>
                </label>
                <h3 style="margin: 0;"><i class="fas fa-bell"></i> Notificaciones</h3>
            </div>
            <span class="notif-close" onclick="cerrarNotificaciones()">&times;</span>
        </div>
        <div class="notif-body" id="notificaciones-lista">
            <div class="notif-empty">
                <i class="fas fa-check-circle" class="notif-empty-icon"></i>
                <p>No hay notificaciones nuevas</p>
            </div>
        </div>
        <div class="notif-footer" id="notif-footer" style="display: none;">
            <button onclick="marcarSeleccionadasLeidas()" id="btn-marcar-leidas">Marcar seleccionadas como leídas</button>
        </div>
    </div>

    <link rel="stylesheet" href="/static/css/notificaciones.css">
    <script type="module" src="/static/notificaciones_loader.js"></script>
    
    <!-- Cargador de menú dinámico -->
    <!-- Sistema de permisos - DEBE CARGAR ANTES que menu_loader -->
    <script src="/static/permisos.js"></script>
    <script src="/static/menu_loader.js?v=1764787001"></script>

    
    <!-- Manejador de navegación del menú -->
    <script src="/static/menu.js?v=1764787002"></script>
    
    <!-- Branding y colores de empresa -->
    <script src="/static/branding.js?v=1764787007"></script>

    <!-- Funciones principales de la aplicación -->
    <script src="/static/app_private.js?v=1764787000"></script>
    
    <!-- Cargar versión de la aplicación -->
    <script src="/static/app_version.js"></script>
    
    <!-- Lógica del sidebar toggle -->
    <script src="/static/sidebar_logic.js"></script>

    <!-- Modal de Perfil de Usuario -->
    <div id="modal-perfil" class="modal-perfil" style="display: none;">
        <div class="modal-perfil-content">
            <div class="modal-perfil-header">
                <h2><i class="fas fa-user-circle"></i> Mi Perfil</h2>
                <span class="modal-perfil-close" onclick="cerrarModalPerfil()">&times;</span>
            </div>
            
            <!-- Pestañas -->
            <div class="modal-perfil-tabs">
                <button class="tab-btn active" onclick="cambiarTab('datos')"><i class="fas fa-user"></i> Datos Personales</button>
                <button class="tab-btn" onclick="cambiarTab('password')"><i class="fas fa-key"></i> Contraseña</button>
                <button class="tab-btn" onclick="cambiarTab('plantilla')"><i class="fas fa-palette"></i> Plantilla</button>
            </div>
            
            <!-- Tab: Datos Personales -->
            <div id="tab-datos" class="tab-content active">
                <form id="form-datos" onsubmit="return guardarDatos(event)">
                    <!-- Avatar -->
                    <div class="form-group" style="text-align: center; margin-bottom: 20px;">
                        <div style="position: relative; display: inline-block; width: 120px; height: 120px;">
                            <img id="perfil-avatar-preview" src="/static/avatars/default.svg" alt="" 
                                 style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--color-primario, #007bff); cursor: pointer; display: block;"
                                 onclick="abrirSelectorAvatares()">
                            <label onclick="abrirSelectorAvatares()" 
                                   style="position: absolute; bottom: 5px; right: 5px; background: var(--color-primario, #007bff); color: white; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 3px solid var(--bg-card, white); box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: all 0.2s ease;"
                                   onmouseover="this.style.transform='scale(1.1)'"
                                   onmouseout="this.style.transform='scale(1)'">
                                <i class="fas fa-camera" style="font-size: 14px;"></i>
                            </label>
                        </div>
                        <input type="file" id="perfil-avatar-input" accept="image/*" style="display: none;" onchange="previsualizarAvatar(event)">
                        <div style="margin-top: 10px; font-size: 11px; color: var(--color-texto-secundario, #666);">
                            Click para elegir avatar
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Nombre de usuario</label>
                        <input type="text" id="perfil-username" disabled>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email</label>
                        <input type="email" id="perfil-email" required>
                    </div>
                    <button type="submit" class="btn-guardar btn-force-blue">Guardar Cambios</button>
                </form>
            </div>
            
            <!-- Tab: Contraseña -->
            <div id="tab-password" class="tab-content">
                <!-- Información del usuario -->
                <div style="background: var(--bg-elevated, #f8f9fa); padding: 12px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid var(--color-primario, #007bff);">
                    <div style="font-size: 12px; color: var(--color-texto-secundario, #666); margin-bottom: 4px;">
                        <i class="fas fa-user"></i> Usuario actual
                    </div>
                    <div style="font-size: 14px; font-weight: 600; color: var(--color-texto, #333);" id="password-info-username">
                        -
                    </div>
                </div>
                
                <form id="form-password" onsubmit="return cambiarPassword(event)">
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Contraseña Actual</label>
                        <div style="position: relative;">
                            <input type="password" id="password-actual" autocomplete="current-password" required style="padding-right: 40px;" placeholder="••••••••">
                            <i class="fas fa-eye-slash" 
                               style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: not-allowed; color: var(--color-texto-secundario, #999); font-size: 16px; opacity: 0.5;" 
                               title="No se puede ver la contraseña actual por seguridad"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Nueva Contraseña</label>
                        <div style="position: relative;">
                            <input type="password" id="password-nueva" autocomplete="new-password" required minlength="6" style="padding-right: 40px;">
                            <i class="fas fa-eye" onclick="togglePasswordVisibility('password-nueva', this)" 
                               style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-texto-secundario, #666); font-size: 16px;"></i>
                        </div>
                        <small style="font-size: 11px; color: var(--color-texto-secundario, #666); display: block; margin-top: 4px;">
                            Mínimo 6 caracteres
                        </small>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Confirmar Nueva Contraseña</label>
                        <div style="position: relative;">
                            <input type="password" id="password-confirmar" autocomplete="new-password" required style="padding-right: 40px;">
                            <i class="fas fa-eye" onclick="togglePasswordVisibility('password-confirmar', this)" 
                               style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-texto-secundario, #666); font-size: 16px;"></i>
                        </div>
                    </div>
                    <button type="submit" class="btn-guardar">Cambiar Contraseña</button>
                </form>
            </div>
            
            <!-- Tab: Plantilla -->
            <div id="tab-plantilla" class="tab-content">
                <div class="plantillas-grid" id="plantillas-grid">
                    <!-- Se llenarán dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Estilos de la modal -->

    <!-- JavaScript de la modal -->
    <script src="/static/app_init.js?v=1763897790"></script>
    <script src="/static/perfil_modal.js?v=ForceUpdate4"></script>
    <script src="/static/modal_theme.js?v=FIX_BORDER_BTN"></script>
    
    <!-- Modal Selector de Avatares -->
    <div id="modal-selector-avatares" class="modal-avatares" style="display: none;">
        <div class="modal-avatares-content">
            <div class="modal-avatares-header">
                <h3><i class="fas fa-images"></i> Seleccionar Avatar</h3>
                <span class="modal-avatares-close" onclick="cerrarSelectorAvatares()">&times;</span>
            </div>
            <div class="modal-avatares-body">
                <!-- Opciones de selección -->
                <div class="modal-avatares-tabs">
                    <button onclick="mostrarAvataresPredefinidos()" id="btn-predefinidos" class="avatar-tab-btn active">
                        <i class="fas fa-th"></i> Avatares Predefinidos
                    </button>
                    <button onclick="mostrarSubirPersonalizado()" id="btn-personalizado" class="avatar-tab-btn">
                        <i class="fas fa-upload"></i> Subir Personalizado
                    </button>
                </div>
                
                <!-- Grid de avatares predefinidos -->
                <div id="avatares-predefinidos" class="avatares-grid">
                    <!-- Se llenará dinámicamente -->
                </div>
                
                <!-- Subir personalizado -->
                <div id="subir-personalizado" class="subir-avatar-container" style="display: none;">
                    <div class="subir-avatar-area" onclick="document.getElementById('perfil-avatar-input').click()">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p class="subir-avatar-text">Click para subir tu propia imagen</p>
                        <p class="subir-avatar-hint">PNG, JPG (máx. 2MB)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
