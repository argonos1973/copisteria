<!DOCTYPE html>
<html lang="es">
<head>
    <script src="/static/session_manager.js?v=1763897790"></script>
    <script src="/static/permisos.js?v=1763897790"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Consulta de Contactos</title>
    <script src="/static/branding.js?v=1764787007"></script>
    <script src="/static/auto_branding.js?v=1764787007"></script>

  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  
  <!-- Google Fonts -->
    <link rel="stylesheet" href="/static/css/theme-consumer.css?v=1763897790">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Enlace al archivo de estilos externo -->
  <link rel="stylesheet" href="../static/css/page_header.css" />
  <link rel="stylesheet" href="../static/css/styles.css?v=1763897790" />
  <link rel="stylesheet" href="/static/css/modales.css?v=1763897790" />
  <link rel="stylesheet" href="../static/css/notificaciones.css" />
  
  <style>
    /* Estilos personalizados para la tabla de contactos */
    /* En esta vista anulamos padding inferior global y reservamos el alto del footer */
    .contactos-page { padding-bottom: 0 !important; }
    #app.container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 96px);
      min-height: 100vh;
      box-sizing: border-box;
      padding-bottom: 0 !important;
    }
    
    .table-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin-top: 10px;
      min-height: 0;
    }
    
    .table-responsive {
      flex: 1;
      max-height: none !important;
      height: 100% !important;
      overflow-y: auto;
      overflow-x: auto; /* Permitir scroll horizontal */
    }
    /* Compactar espacios para ganar área de grid */
    .form-inline { margin: 4px 0; }
    .pagination { margin-top: 6px; }
    .contactos-page .pagination { margin-bottom: 8px !important; }
    
    /* Asegurar ancho mínimo para acciones */
    .acciones-col {
        min-width: 140px !important;
    }
    
    /* Forzar layout automático para evitar cortes */
    .contactos-page table.grid {
        table-layout: auto !important;
        width: 100% !important;
    }
    
    /* Asegurar visibilidad de cabeceras */
    .contactos-page table.grid th {
        visibility: visible !important;
        display: table-cell !important;
    }
  </style>

  <!-- Vue.js y Axios (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  
  <!-- Sistema de permisos UI -->
  <script type="module" src="../static/permisos_ui.js?v=1763897790"></script>
    <link rel="stylesheet" href="/static/css/mobile.css?v=20251224">
</head>
<body class="contactos-page">
  <div id="app" class="container">
    <div class="page-header">
      <h1><i class="fas fa-address-book"></i> Contactos</h1>
    </div>
    
    <!-- Contenedor de Filtros -->
    <div class="form-inline">
      <div class="form-group">
        <label for="razonSocialInput">Razón Social:</label>
        <input
          type="text"
          id="razonSocialInput"
          
          placeholder="Nombre del contacto..."
          
        />
      </div>
      <div class="form-group">
        <label for="nifInput">Identificador:</label>
        <input
          type="text"
          id="nifInput"
          
          placeholder="Identificador del contacto..."
          
        />
      </div>
      <div class="form-group">
        <button 
          class="btn-icon"
          id="btn-nuevo-contacto"
          data-modulo="contactos"
          data-accion="crear"
          title="Nuevo Contacto"><i class="fas fa-plus"></i></button>
      </div>
    </div>

    <!-- Controles de paginación (debajo de filtros, compacto) -->
    <div class="pagination" style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;margin-bottom:4px;padding:6px 8px;border:1px solid #e0e0e0;border-radius:8px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <button id="prevPageContactos" class="btn btn-secondary" style="padding:4px 8px;font-size:12px;">⟨</button>
        <span id="pageInfoContactos" style="font-size:12px;">Página 1 de 1</span>
        <button id="nextPageContactos" class="btn btn-secondary" style="padding:4px 8px;font-size:12px;">⟩</button>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
        <label>Por página:
          <select id="pageSizeSelectContactos" style="padding:2px 6px;font-size:12px;" onchange="window.handlePageSizeChangeContactos && window.handlePageSizeChangeContactos()" oninput="window.handlePageSizeChangeContactos && window.handlePageSizeChangeContactos()">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </label>
      </div>
    </div>

    <!-- Contenedor de la Tabla -->
    <div class="table-container" style="margin-top:0; min-height:0; flex:1;">
      <div class="table-responsive">
        <table class="grid">
          <thead>
            <tr>
              <th class="razon-social" style="width: 35%;">Razón Social</th>
              <th class="nif-col" style="width: 15%;">Identificador</th>
              <th class="email-col" style="width: 25%;">Email</th>
              <th class="proforma-col" title="Proforma Abierta" style="width: 10%;">Proforma</th>
              <th class="acciones-col" style="width: 15%; text-align: center;">Acciones</th>
            </tr>
          </thead>
          <tbody id="contactosTbody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <!-- Un solo script "type=module" para importar y usar las constantes -->
  <script type="module">
    import { IP_SERVER, PORT, API_URL as API_URL_BASE } from '../static/constantes.js?v=1763897790';
    import { mostrarNotificacion, mostrarConfirmacion } from '../static/notificaciones.js';

    // Usar API_URL de constantes.js que detecta automáticamente el protocolo
    const API_URL = `${API_URL_BASE}/api`;

    // Reactive data
    const filters = {
      razonSocial: '',
      nif: ''
    };

    let contactos = [];
    let loading = false;
    const pagination = {
      page: 1,
      pageSize: 10,
      totalPages: 1,
      sort: 'razonsocial',
      order: 'ASC'
    };

    const razonSocialInput = document.getElementById('razonSocialInput');
    const nifInput = document.getElementById('nifInput');
    const btnNuevoContacto = document.getElementById('btn-nuevo-contacto');
    const prevBtn = document.getElementById('prevPageContactos');
    const nextBtn = document.getElementById('nextPageContactos');
    const pageInfo = document.getElementById('pageInfoContactos');
    const pageSizeSelect = document.getElementById('pageSizeSelectContactos');
    const tbody = document.getElementById('contactosTbody');

    const setLoading = (isLoading) => {
      loading = !!isLoading;
      if (prevBtn) prevBtn.disabled = loading || pagination.page <= 1;
      if (nextBtn) nextBtn.disabled = loading || pagination.page >= pagination.totalPages;
    };

    const updatePaginationUI = () => {
      if (pageInfo) pageInfo.textContent = `Página ${pagination.page} de ${pagination.totalPages}`;
      if (prevBtn) prevBtn.disabled = loading || pagination.page <= 1;
      if (nextBtn) nextBtn.disabled = loading || pagination.page >= pagination.totalPages;
      if (pageSizeSelect) pageSizeSelect.value = String(pagination.pageSize);
    };

    // Función para guardar filtros en sessionStorage
    const guardarFiltros = () => {
      sessionStorage.setItem('filtrosContactos', JSON.stringify({
        razonSocial: filters.razonSocial,
        nif: filters.nif,
        page: pagination.page,
        pageSize: pagination.pageSize
      }));
    };

    // Función para restaurar filtros desde sessionStorage
    const restaurarFiltros = () => {
      const filtrosGuardados = sessionStorage.getItem('filtrosContactos');
      if (filtrosGuardados) {
        const f = JSON.parse(filtrosGuardados);
        filters.razonSocial = f.razonSocial || '';
        filters.nif = f.nif || '';
        pagination.page = Number(f.page) > 0 ? Number(f.page) : 1;
        pagination.pageSize = [10,20,50,100].includes(Number(f.pageSize)) ? Number(f.pageSize) : 10;
      } else {
        filters.razonSocial = '';
        filters.nif = '';
        pagination.page = 1;
        pagination.pageSize = 10;
        guardarFiltros();
      }

      if (razonSocialInput) razonSocialInput.value = filters.razonSocial;
      if (nifInput) nifInput.value = filters.nif;
      if (pageSizeSelect) pageSizeSelect.value = String(pagination.pageSize);
      updatePaginationUI();
    };

    const renderRows = () => {
      if (!tbody) return;
      tbody.innerHTML = '';

      if (loading) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 5;
        td.style.textAlign = 'center';
        td.textContent = 'Cargando contactos...';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      if (!contactos || contactos.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 5;
        td.style.textAlign = 'left';
        td.textContent = 'No se encontraron contactos.';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      contactos.forEach((contacto) => {
        if (!contacto) return;

        const tr = document.createElement('tr');
        tr.addEventListener('click', () => verContacto(contacto.idContacto));

        const tdRazon = document.createElement('td');
        tdRazon.className = 'razon-social';
        tdRazon.title = contacto.razonsocial || '';
        tdRazon.textContent = contacto.razonsocial || '';

        const tdNif = document.createElement('td');
        tdNif.className = 'nif-col';
        tdNif.title = contacto.identificador || '';
        tdNif.textContent = contacto.identificador || '';

        const tdEmail = document.createElement('td');
        tdEmail.className = 'email-col';
        tdEmail.title = contacto.mail || '';
        tdEmail.textContent = contacto.mail || '';

        const tdProformaNum = document.createElement('td');
        tdProformaNum.className = 'proforma-col';
        tdProformaNum.title = contacto.numero_proforma_abierta || '';
        tdProformaNum.textContent = contacto.numero_proforma_abierta || '';

        const tdAcciones = document.createElement('td');
        tdAcciones.className = 'acciones-col';
        tdAcciones.style.textAlign = 'center';
        tdAcciones.style.whiteSpace = 'nowrap';

        if (contacto.identificador) {
          const btnProforma = document.createElement('button');
          btnProforma.className = 'btn-icon';
          btnProforma.dataset.modulo = 'proformas';
          btnProforma.dataset.accion = 'crear';
          btnProforma.title = contacto.numero_proforma_abierta ? 'Modificar Proforma' : 'Crear Proforma';
          btnProforma.style.marginRight = '5px';
          btnProforma.textContent = '✎';
          btnProforma.addEventListener('click', (e) => {
            e.stopPropagation();
            crearProforma(contacto.idContacto);
          });

          const btnFactura = document.createElement('button');
          btnFactura.className = 'btn-icon';
          btnFactura.dataset.modulo = 'facturas';
          btnFactura.dataset.accion = 'crear';
          btnFactura.title = 'Crear Factura';
          btnFactura.style.marginRight = '5px';
          btnFactura.textContent = '⚡';
          btnFactura.addEventListener('click', (e) => {
            e.stopPropagation();
            crearFactura(contacto.idContacto);
          });

          tdAcciones.appendChild(btnProforma);
          tdAcciones.appendChild(btnFactura);
        }

        const btnEliminar = document.createElement('button');
        btnEliminar.className = 'btn-icon';
        btnEliminar.dataset.modulo = 'contactos';
        btnEliminar.dataset.accion = 'eliminar';
        btnEliminar.title = 'Eliminar';
        btnEliminar.textContent = '✕';
        btnEliminar.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteContacto(contacto.idContacto);
        });
        tdAcciones.appendChild(btnEliminar);

        tr.appendChild(tdRazon);
        tr.appendChild(tdNif);
        tr.appendChild(tdEmail);
        tr.appendChild(tdProformaNum);
        tr.appendChild(tdAcciones);
        tbody.appendChild(tr);
      });

      if (typeof aplicarPermisosAElementos !== 'undefined') {
        aplicarPermisosAElementos();
      }
    };

    // Llamada a la API de contactos (paginado)
    const fetchContactos = async () => {
      try {
        setLoading(true);
        renderRows();
        updatePaginationUI();

        const queryParams = new URLSearchParams({
          razonSocial: filters.razonSocial,
          nif: filters.nif,
          page: String(pagination.page),
          pageSize: String(pagination.pageSize),
          sort: pagination.sort,
          order: pagination.order,
          _ts: String(Date.now())
        });

        const response = await fetch(`${API_URL}/contactos/paginado?${queryParams}`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Error en la búsqueda');

        const data = await response.json();
        contactos = (data.items || []).filter(Boolean);
        pagination.totalPages = data.total_pages || 1;
      } catch (error) {
        contactos = [];
        pagination.totalPages = 1;
      } finally {
        setLoading(false);
        updatePaginationUI();
        renderRows();
      }
    };

    // Eliminar contacto
    const deleteContacto = async (id) => {
      // Verificar permiso
      if (typeof verificarPermisoConAlerta !== 'undefined') {
        if (!verificarPermisoConAlerta('contactos', 'eliminar')) {
          return;
        }
      }

      try {
        const confirmado = await mostrarConfirmacion('¿Está seguro de eliminar este contacto?');
        if (!confirmado) return;

        const res = await fetch(`${API_URL}/contactos/eliminar_contacto/${id}`, { method: 'DELETE' });
        if (!res.ok) {
          let msg = 'No se pudo eliminar el contacto. Inténtalo de nuevo.';
          try {
            const body = await res.json();
            msg = body?.error || msg;
          } catch (_) {}
          throw new Error(msg);
        }

        mostrarNotificacion('Contacto eliminado correctamente', 'success');
        fetchContactos();
      } catch (error) {
        mostrarNotificacion(error?.message || 'No se pudo eliminar el contacto. Inténtalo de nuevo.', 'error');
      }
    };

    // Crear Proforma y Factura
    const crearProforma = (id) => {
      // Verificar permiso
      if (typeof verificarPermisoConAlerta !== 'undefined') {
        if (!verificarPermisoConAlerta('proformas', 'crear')) {
          return;
        }
      }

      // Guardar filtros antes de navegar
      guardarFiltros();
      // Asegurarnos de que el origen se guarda en sessionStorage
      sessionStorage.setItem('origenProforma', 'contactos');
      window.location.href = `GESTION_PROFORMAS.html?idContacto=${id}&origen=contactos`;
    };

    const crearFactura = (id) => {
      // Verificar permiso
      if (typeof verificarPermisoConAlerta !== 'undefined') {
        if (!verificarPermisoConAlerta('facturas', 'crear')) {
          return;
        }
      }

      guardarFiltros();
      // Guardar origen para volver a la lista de facturas
      sessionStorage.setItem('origenFactura', 'facturas');
      window.location.href = `GESTION_FACTURAS.html?idContacto=${id}`;
      // TODO: Implementar la creación de factura
    };

    // Manejo de la búsqueda (con debounce)
    let debounceTimer = null;
    const handleSearch = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        filters.razonSocial = razonSocialInput ? razonSocialInput.value : '';
        filters.nif = nifInput ? nifInput.value : '';
        pagination.page = 1; // Reiniciar a primera página al cambiar filtros
        guardarFiltros();
        fetchContactos();
      }, 800);
    };

    const nextPage = () => {
      if (pagination.page < pagination.totalPages) {
        pagination.page += 1;
        guardarFiltros();
        fetchContactos();
      }
    };

    const prevPage = () => {
      if (pagination.page > 1) {
        pagination.page -= 1;
        guardarFiltros();
        fetchContactos();
      }
    };

    const handlePageSizeChange = () => {
      const newSize = parseInt(pageSizeSelect ? pageSizeSelect.value : '10', 10);
      pagination.pageSize = [10,20,50,100].includes(newSize) ? newSize : 10;
      pagination.page = 1; // Volver a primera página al cambiar tamaño
      guardarFiltros();
      fetchContactos();
    };

    window.handlePageSizeChangeContactos = handlePageSizeChange;

    // Ver contacto existente
    const verContacto = (id) => {
      // Guardar filtros antes de navegar
      guardarFiltros();
      window.location.href = `GESTION_CONTACTOS.html?id=${id}`;
    };

    // Nuevo contacto
    const nuevoContacto = () => {
      // Verificar permiso
      if (typeof verificarPermisoConAlerta !== 'undefined') {
        if (!verificarPermisoConAlerta('contactos', 'crear')) {
          return;
        }
      }

      // Guardar filtros antes de navegar
      guardarFiltros();
      window.location.href = 'GESTION_CONTACTOS.html';
    };

    // Cargar datos al montar el componente
    document.addEventListener('DOMContentLoaded', async () => {
      restaurarFiltros();
      await fetchContactos();

      if (typeof aplicarPermisosAElementos !== 'undefined') {
        aplicarPermisosAElementos();
      }

      if (razonSocialInput) {
        razonSocialInput.focus();
      }
    });

    if (razonSocialInput) razonSocialInput.addEventListener('input', handleSearch);
    if (nifInput) nifInput.addEventListener('input', handleSearch);
    if (btnNuevoContacto) btnNuevoContacto.addEventListener('click', nuevoContacto);
    if (prevBtn) prevBtn.addEventListener('click', prevPage);
    if (nextBtn) nextBtn.addEventListener('click', nextPage);
    if (pageSizeSelect) pageSizeSelect.addEventListener('change', handlePageSizeChange);
    if (pageSizeSelect) pageSizeSelect.addEventListener('input', handlePageSizeChange);
  </script>
  
  <!-- Contenedor para notificaciones -->
  <div id="notificaciones-contenedor"></div>
</body>
</html>
