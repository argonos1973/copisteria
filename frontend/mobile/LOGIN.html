<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Aleph70 Mobile</title>
    <!-- SessionManager -->
    <script src="/static/session_manager.js?v=1763897790"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Fuentes e Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Móvil -->
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
    
    <style>
        body {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }
        
        .login-logo {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .login-logo img {
            max-width: 140px;
            height: auto;
        }
        
        .login-form {
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            background-color: #f9f9f9;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: var(--color-primary);
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.1);
        }
        
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--color-primary), #c0392b);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
        }

        .forgot-link {
            text-align: center;
            margin-top: 12px;
        }

        .forgot-link a {
            color: var(--color-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .forgot-link a:active {
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #eee;
            z-index: 1;
        }
        
        .divider span {
            background-color: #fff;
            padding: 0 15px;
            color: #999;
            font-size: 14px;
            position: relative;
            z-index: 2;
        }
        
        .google-btn-container {
            display: flex;
            justify-content: center;
        }
        
        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        
        .alert-error {
            background-color: #fadbd8;
            color: #c0392b;
            border: 1px solid #f5b7b1;
        }
        
        .alert-success {
            background-color: #d5f5e3;
            color: #27ae60;
            border: 1px solid #abebc6;
        }
        
        /* Empresa Selector */
        #empresa-selector {
            display: none;
        }
        
        .empresa-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .empresa-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            margin-right: 15px;
            object-fit: cover;
        }
        
        .empresa-nombre {
            font-weight: 500;
            color: #333;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #eee;
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-logo">
        <img src="/static/logos/aleph_completo.png?v=1763897790" alt="Aleph">
    </div>
    
    <div id="alert-container" class="alert"></div>

    <!-- Login Form -->
    <form id="login-form" class="login-form">
        <div class="form-group">
            <label class="form-label">Usuario</label>
            <input type="text" id="username" class="form-control" placeholder="Introduce tu usuario" required autocomplete="username">
        </div>
        
        <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="Introduce tu contraseña" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn-login" id="btn-login">Iniciar Sesión</button>

        <div class="forgot-link">
            <a href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
        </div>
        
        <div class="divider">
            <span>O accede con</span>
        </div>
        
        <div id="google-btn-container" class="google-btn-container"></div>
    </form>
    
    <!-- Empresa Selector -->
    <div id="empresa-selector" class="login-form">
        <h3 style="margin-bottom: 20px; font-weight: 600; text-align: center;">Selecciona Empresa</h3>
        <div id="empresas-lista"></div>
        <button type="button" class="btn-login" onclick="volverLogin()" style="background: #95a5a6; margin-top: 15px;">
            Cancelar
        </button>
    </div>

    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <p style="margin-top: 15px; color: #555;">Procesando...</p>
    </div>

    <script>
        // Limpieza de sesión
        try {
            localStorage.removeItem('aleph70_session');
            sessionStorage.clear();
            if(window.sessionManager) window.sessionManager.clearSession();
        } catch(e) {}

        // Google Auth
        async function handleGoogleCredentialResponse(response) {
            mostrarCargando(true);
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token: response.credential })
                });
                const data = await res.json();
                
                if (res.ok && data.success) {
                    mostrarAlerta(`Bienvenido ${data.usuario || ''}`, 'success');
                    setTimeout(() => window.location.href = "/api/auth/app", 1000);
                } else {
                    mostrarAlerta(data.error || 'Error con Google', 'error');
                    mostrarCargando(false);
                }
            } catch (e) {
                mostrarAlerta('Error de conexión', 'error');
                mostrarCargando(false);
            }
        }

        window.onload = async function() {
            try {
                const res = await fetch('/api/auth/config');
                if(res.ok) {
                    const config = await res.json();
                    if(config.google_client_id) {
                        google.accounts.id.initialize({
                            client_id: config.google_client_id,
                            callback: handleGoogleCredentialResponse,
                            auto_select: false
                        });
                        google.accounts.id.renderButton(
                            document.getElementById("google-btn-container"),
                            { theme: "outline", size: "large", width: "100%" }
                        );
                    }
                }
            } catch(e) {}
        };

        // Login Submit
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            
            if(!user || !pass) return mostrarAlerta('Completa los campos', 'error');
            
            mostrarCargando(true);
            
            try {
                // Obtener empresas
                const res = await fetch(`/api/auth/empresas/${user}`);
                const empresas = await res.json();
                
                if(empresas.length === 0) {
                    mostrarAlerta('Usuario sin empresas', 'error');
                    mostrarCargando(false);
                } else if(empresas.length === 1) {
                    await realizarLogin(user, pass, empresas[0].codigo);
                } else {
                    mostrarSelectorEmpresas(user, pass, empresas);
                    mostrarCargando(false);
                }
            } catch(e) {
                mostrarAlerta('Error verificando usuario', 'error');
                mostrarCargando(false);
            }
        });

        async function realizarLogin(user, pass, empresaCodigo) {
            mostrarCargando(true);
            try {
                const result = await window.sessionManager.login(user, pass, empresaCodigo);
                if (result.success) {
                    mostrarAlerta('Login correcto', 'success');
                    setTimeout(() => window.location.href = "/api/auth/app", 1000);
                } else {
                    mostrarAlerta(result.error || 'Credenciales incorrectas', 'error');
                    mostrarCargando(false);
                }
            } catch (e) {
                mostrarAlerta('Error de conexión', 'error');
                mostrarCargando(false);
            }
        }

        function mostrarSelectorEmpresas(user, pass, empresas) {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('empresa-selector').style.display = 'block';
            
            const lista = document.getElementById('empresas-lista');
            lista.innerHTML = '';
            
            empresas.forEach(emp => {
                const div = document.createElement('div');
                div.className = 'empresa-item';
                div.onclick = () => realizarLogin(user, pass, emp.codigo);
                div.innerHTML = `
                    <img src="${emp.logo}" class="empresa-logo" onerror="this.src='/static/logos/default_header.png'">
                    <span class="empresa-nombre">${emp.nombre}</span>
                `;
                lista.appendChild(div);
            });
        }

        function volverLogin() {
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('empresa-selector').style.display = 'none';
            document.getElementById('password').value = '';
        }

        function mostrarAlerta(msg, type) {
            const el = document.getElementById('alert-container');
            el.textContent = msg;
            el.className = `alert alert-${type}`;
            el.style.display = 'block';
            if(type === 'error') setTimeout(() => el.style.display = 'none', 3000);
        }

        function mostrarCargando(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
