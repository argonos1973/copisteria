<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Aleph70</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Móvil -->
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
</head>
<body>

    <!-- Header Fijo Superior -->
    <header class="mobile-header">
        <div class="header-left" style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-menu-drawer" style="background:none; border:none; font-size: 20px; color: var(--color-text); padding: 5px;">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/static/logos/default_header.png" alt="Logo" style="height: 28px;">
        </div>
        <div class="header-center">
            <span class="header-title">Resumen</span>
        </div>
        <div class="header-right">
            <i class="fas fa-user-circle" style="font-size: 24px; color: #555;"></i>
        </div>
    </header>

    <!-- Drawer Menu (Sidebar Móvil) -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="mobile-drawer" id="mobile-drawer">
        <div class="drawer-header">
            <img src="/static/logos/default_header.png" alt="Logo" style="height: 30px;">
            <button id="btn-close-drawer"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-content" id="drawer-menu-list">
            <!-- Se llenará con JS -->
            <div style="padding: 20px; text-align: center; color: #999;">Cargando menú...</div>
        </div>
        <div class="drawer-footer">
            <div class="user-mini-profile">
                <div class="user-name" id="drawer-username">Usuario</div>
                <div class="user-role" id="drawer-rol">Rol</div>
            </div>
            <button class="btn-logout" onclick="logoutApp()">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </aside>

    <!-- Contenido Principal (Scrollable) -->
    <main class="mobile-content">
        <div class="dashboard-mobile">
            <!-- Resumen Ventas -->
            <div class="card summary-card">
                <h4>Ventas Mes Actual</h4>
                <div class="summary-value" id="ventas-hoy">0,00 €</div>
                <small class="text-muted">Balance: <span id="balance-mes">0,00 €</span></small>
            </div>

            <!-- Accesos Rápidos -->
            <div class="quick-actions">
                <button class="btn-mobile" onclick="window.location.href='/api/auth/mobile/tickets/gestion'">
                    <i class="fas fa-plus"></i> Nuevo Ticket
                </button>
            </div>

            <!-- Últimos Movimientos -->
            <div class="section-title">Últimos Tickets</div>
            <div id="ultimos-tickets-list">
                <div class="card ticket-item">
                    <div class="ticket-header">
                        <span class="ticket-id">Cargando...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Navegación Inferior (Sticky Bottom) -->
    <nav class="bottom-nav">
        <a href="/api/auth/app" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        <a href="/CONSULTA_FACTURAS.html" class="nav-item">
            <i class="fas fa-file-invoice-dollar"></i>
            <span>Facturas</span>
        </a>
        <a href="/api/auth/mobile/tickets" class="nav-item">
            <i class="fas fa-ticket-alt"></i>
            <span>Tickets</span>
        </a>
        <a href="/api/auth/mobile/tickets/gestion" class="nav-item">
            <i class="fas fa-plus-circle" style="font-size: 32px; color: var(--color-primary); margin-bottom: 0;"></i>
        </a>
        <a href="/CONSULTA_GASTOS.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>Gastos</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="/static/mobile/js/app.js"></script>
    <script src="/static/mobile/js/dashboard.js"></script>
</body>
</html>
