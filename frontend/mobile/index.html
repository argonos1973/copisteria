<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - Aleph70</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Móvil -->
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
    
    <style>
        .summary-card {
            background: linear-gradient(135deg, var(--color-primary), #c0392b);
            color: white;
        }
        .summary-value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }
        .text-muted {
            color: rgba(255,255,255,0.8);
        }
        .section-title {
            margin: 20px 0 10px;
            font-weight: 600;
            color: #7f8c8d;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .ticket-item {
            display: flex;
            flex-direction: column;
            padding: 12px;
        }
        .ticket-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .ticket-id { font-weight: bold; }
        .ticket-total { font-size: 18px; font-weight: 600; color: var(--color-primary); }
        .ticket-body {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .badge-success {
            background-color: #2ecc71;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
        }
    </style>
</head>
<body>

    <!-- Header Fijo Superior -->
    <header class="mobile-header">
        <div class="header-left" style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-menu-drawer" style="background:none; border:none; font-size: 20px; color: var(--color-text); padding: 5px;">
                <i class="fas fa-bars"></i>
            </button>
            <img src="/static/logos/default_header.png" alt="Logo" style="height: 28px;">
        </div>
        <div class="header-center">
            <span class="header-title">Resumen</span>
        </div>
        <div class="header-right">
            <i class="fas fa-user-circle" style="font-size: 24px; color: #555;"></i>
        </div>
    </header>

    <!-- Drawer Menu (Sidebar Móvil) -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="mobile-drawer" id="mobile-drawer">
        <div class="drawer-header">
            <img src="/static/logos/default_header.png" alt="Logo" style="height: 30px;">
            <button id="btn-close-drawer"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-content" id="drawer-menu-list">
            <!-- Se llenará con JS -->
            <div style="padding: 20px; text-align: center; color: #999;">Cargando menú...</div>
        </div>
        <div class="drawer-footer">
            <div class="user-mini-profile">
                <div class="user-name" id="drawer-username">Usuario</div>
                <div class="user-role" id="drawer-rol">Rol</div>
            </div>
            <button class="btn-logout" onclick="logoutApp()">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>
    </aside>

    <!-- Contenido Principal (Scrollable) -->
    <main class="mobile-content">
        <div class="dashboard-mobile">
            <!-- Resumen Ventas -->
            <div class="card summary-card">
                <h4>Ventas Mes Actual</h4>
                <div class="summary-value" id="ventas-hoy">0,00 €</div>
                <small class="text-muted">Balance: <span id="balance-mes">0,00 €</span></small>
            </div>

            <!-- Accesos Rápidos -->
            <div class="quick-actions">
                <button class="btn-mobile" onclick="window.location.href='/api/auth/mobile/tickets/gestion'">
                    <i class="fas fa-plus"></i> Nuevo Ticket
                </button>
            </div>

            <!-- Últimos Movimientos -->
            <div class="section-title">Últimos Tickets</div>
            <div id="ultimos-tickets-list">
                <div class="card ticket-item">
                    <div class="ticket-header">
                        <span class="ticket-id">Cargando...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Navegación Inferior (Sticky Bottom) -->
    <nav class="bottom-nav">
        <a href="/api/auth/app" class="nav-item active">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        <a href="/CONSULTA_FACTURAS.html" class="nav-item">
            <i class="fas fa-file-invoice-dollar"></i>
            <span>Facturas</span>
        </a>
        <a href="/api/auth/mobile/tickets" class="nav-item">
            <i class="fas fa-ticket-alt"></i>
            <span>Tickets</span>
        </a>
        <a href="/api/auth/mobile/tickets/gestion" class="nav-item">
            <i class="fas fa-plus-circle" style="font-size: 32px; color: var(--color-primary); margin-bottom: 0;"></i>
        </a>
        <a href="/CONSULTA_GASTOS.html" class="nav-item">
            <i class="fas fa-chart-pie"></i>
            <span>Gastos</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="/static/mobile/js/app.js"></script>
    <script>
        // Lógica específica del dashboard móvil
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Dashboard Móvil Iniciado');
            cargarResumen();
            cargarTickets();
        });

        async function cargarResumen() {
            try {
                // Consumir API existente de estadísticas
                const response = await fetch('/api/dashboard/estadisticas_gastos');
                if (!response.ok) throw new Error('Error cargando datos');
                
                const data = await response.json();
                
                // Actualizar UI
                if(data.ingresos_mes_actual !== undefined) {
                    document.getElementById('ventas-hoy').textContent = formatCurrency(data.ingresos_mes_actual);
                }
                if(data.balance_mes_actual !== undefined) {
                    document.getElementById('balance-mes').textContent = formatCurrency(data.balance_mes_actual);
                }
                
            } catch (error) {
                console.error('Error resumen:', error);
            }
        }

        async function cargarTickets() {
            try {
                // Pedir últimos 5 tickets
                const response = await fetch('/api/tickets/paginado?page=1&limit=5&orden=desc');
                if (!response.ok) throw new Error('Error cargando tickets');
                
                const data = await response.json();
                const tickets = data.tickets || data.data || []; // Ajustar según respuesta real
                
                const list = document.getElementById('ultimos-tickets-list');
                list.innerHTML = '';

                if (tickets.length === 0) {
                    list.innerHTML = '<div style="padding:15px; text-align:center;">No hay tickets recientes</div>';
                    return;
                }

                tickets.forEach(ticket => {
                    const el = document.createElement('div');
                    el.className = 'card ticket-item';
                    el.onclick = () => window.location.href = `/api/auth/mobile/tickets/gestion?id=${ticket.id}`; // Editar
                    
                    // Determinar clase de estado
                    let badgeClass = 'badge-success';
                    let estadoTexto = ticket.estado;
                    if(ticket.estado === 'P' || ticket.estado === 'Pendiente') {
                        badgeClass = 'badge-warning';
                        estadoTexto = 'Pendiente';
                    } else if(ticket.estado === 'C' || ticket.estado === 'Cobrado') {
                        badgeClass = 'badge-success';
                        estadoTexto = 'Cobrado';
                    } else {
                        badgeClass = 'badge-danger';
                    }

                    el.innerHTML = `
                        <div class="ticket-header">
                            <span class="ticket-id">${ticket.numero}</span>
                            <span class="ticket-status ${badgeClass}" style="background-color: ${badgeClass === 'badge-success' ? '#2ecc71' : (badgeClass === 'badge-warning' ? '#f39c12' : '#e74c3c')}; color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px;">${estadoTexto}</span>
                        </div>
                        <div class="ticket-body">
                            <span class="ticket-date">${ticket.fecha}</span>
                            <span class="ticket-total">${formatCurrency(ticket.total)}</span>
                        </div>
                    `;
                    list.appendChild(el);
                });
                
            } catch (error) {
                console.error('Error tickets:', error);
                document.getElementById('ultimos-tickets-list').innerHTML = '<div style="color:red; text-align:center;">Error cargando tickets</div>';
            }
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' }).format(value);
        }
    </script>
</body>
</html>
