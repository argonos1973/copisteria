<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presupuestos - Aleph70</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
</head>
<body>
    <header class="mobile-header">
        <div class="header-left" style="display: flex; align-items: center; gap: 15px;">
            <button id="btn-menu-drawer" style="background:none; border:none; font-size: 20px; color: var(--color-text); padding: 5px;">
                <i class="fas fa-bars"></i>
            </button>
            <span class="header-title">Presupuestos</span>
        </div>
        <div class="header-right">
            <img src="" alt="" style="height: 28px; display:none;">
        </div>
    </header>

    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="mobile-drawer" id="mobile-drawer">
        <div class="drawer-header">
            <img src="/static/logos/default_header.png" alt="Logo" style="height: 30px;">
            <button id="btn-close-drawer"><i class="fas fa-times"></i></button>
        </div>
        <div class="drawer-content" id="drawer-menu-list"></div>
        <div class="drawer-footer">
            <div class="user-mini-profile">
                <div class="user-name" id="drawer-username">Usuario</div>
                <div class="user-role" id="drawer-rol">Rol</div>
            </div>
            <button class="btn-logout" onclick="logoutApp()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </aside>

    <main class="mobile-content" style="padding: 0; background: #f5f7fa;">
        <div class="search-bar" style="flex-direction: column; gap: 8px;">
            <div class="search-input-container" style="width: 100%;">
                <i class="fas fa-search search-icon"></i>
                <input type="text" class="search-input" id="search-input" placeholder="Buscar presupuesto...">
            </div>
            <div style="display: flex; gap: 5px;">
                <input type="date" id="fecha-desde" class="search-input" style="padding: 8px; font-size: 12px;">
                <input type="date" id="fecha-hasta" class="search-input" style="padding: 8px; font-size: 12px;">
                <button class="btn-filter" id="btn-refresh" style="width: auto; padding: 0 15px; border-radius: 8px;">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <div class="tickets-list" id="tickets-container">
            <div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> Cargando...</div>
        </div>

        <a href="/api/auth/mobile/presupuestos/gestion" class="fab-add"><i class="fas fa-plus"></i></a>
    </main>

    <nav class="bottom-nav">
        <a href="/api/auth/app" class="nav-item"><i class="fas fa-home"></i><span>Inicio</span></a>
        <a href="/api/auth/mobile/facturas" class="nav-item"><i class="fas fa-file-invoice-dollar"></i><span>Facturas</span></a>
        <a href="/api/auth/mobile/tickets" class="nav-item"><i class="fas fa-ticket-alt"></i><span>Tickets</span></a>
        <a href="#" class="nav-item active"><i class="fas fa-file-contract"></i><span>Presup.</span></a>
    </nav>

    <script src="/static/mobile/js/app.js"></script>
    <script src="/static/mobile/js/presupuestos.js"></script>
</body>
</html>
