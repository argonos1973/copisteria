<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión Contacto - Aleph70</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
</head>
<body>
    <header class="mobile-header">
        <div class="header-left">
            <button onclick="history.back()" style="background:none; border:none; font-size: 20px; color: var(--color-text); margin-right: 15px;">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="header-title" id="page-title">Nuevo Contacto</span>
        </div>
        <div class="header-right">
            <button onclick="guardarContacto()" style="background:none; border:none; color: var(--color-primary); font-weight: 600;">Guardar</button>
        </div>
    </header>

    <main class="mobile-content" style="background: #fff; padding: 20px;">
        <div class="form-group">
            <label class="form-label">Razón Social / Nombre</label>
            <input type="text" class="form-control" id="razonsocial" placeholder="Nombre completo">
        </div>
        <div class="form-group">
            <label class="form-label">NIF / CIF</label>
            <input type="text" class="form-control" id="identificador" placeholder="12345678X">
        </div>
        <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input type="tel" class="form-control" id="telefono" placeholder="600000000">
        </div>
        <div class="form-group">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" id="direccion" placeholder="Calle...">
        </div>
        <div style="display:flex; gap:10px;">
            <div class="form-group" style="flex:1;">
                <label class="form-label">C.P.</label>
                <input type="text" class="form-control" id="cp">
            </div>
            <div class="form-group" style="flex:2;">
                <label class="form-label">Localidad</label>
                <input type="text" class="form-control" id="localidad">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Provincia</label>
            <input type="text" class="form-control" id="provincia">
        </div>
    </main>

    <script src="/static/mobile/js/app.js"></script>
    <script src="/static/mobile/js/gestion_contactos.js"></script>
</body>
</html>
