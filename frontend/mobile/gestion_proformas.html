<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión Proforma - Aleph70</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
</head>
<body>
    <header class="mobile-header">
        <div class="header-left">
            <button onclick="history.back()" style="background:none; border:none; font-size: 20px; color: var(--color-text); margin-right: 15px;">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="header-title" id="page-title">Nueva Proforma</span>
        </div>
        <div class="header-right">
            <button onclick="guardarProforma()" style="background:none; border:none; color: var(--color-primary); font-weight: 600;">Guardar</button>
        </div>
    </header>

    <div class="form-section">
        <div class="form-label">CLIENTE</div>
        <div class="client-selector" onclick="abrirModalCliente()">
            <div id="cliente-nombre">Seleccionar Cliente</div>
            <i class="fas fa-chevron-right" style="color:#ccc;"></i>
        </div>
        <input type="hidden" id="cliente-id">
    </div>

    <div class="form-section" style="min-height: 200px;">
        <div class="form-label">CONCEPTOS</div>
        <div id="lineas-container">
            <div style="text-align:center; padding: 20px; color: #aaa;" id="empty-msg">Añade productos</div>
        </div>
    </div>

    <div class="form-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span style="color:#888;">Base Imponible</span>
            <span id="resumen-base">0,00 €</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
            <span style="color:#888;">Impuestos</span>
            <span id="resumen-iva">0,00 €</span>
        </div>
    </div>

    <button class="fab-add-line" onclick="abrirModalProducto()"><i class="fas fa-plus"></i></button>

    <div class="gestion-footer">
        <div class="total-display">
            <span class="total-label">TOTAL</span>
            <span class="total-value" id="total-final">0,00 €</span>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-mobile" id="modal-producto">
        <div class="modal-header">
            <button onclick="cerrarModalProducto()" style="border:none; background:none; font-size:20px;"><i class="fas fa-times"></i></button>
            <span style="font-weight:600;">Añadir Concepto</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <input type="text" class="form-control" id="prod-search" placeholder="Buscar producto..." oninput="buscarProductos(this.value)">
                <div id="prod-resultados" style="display:none; border:1px solid #eee; margin-top:5px;"></div>
            </div>
            <div class="form-group"><input type="text" class="form-control" id="prod-desc" placeholder="Descripción"></div>
            <div style="display:flex; gap:10px;">
                <input type="number" class="form-control" id="prod-cant" value="1">
                <input type="number" class="form-control" id="prod-precio" placeholder="Precio">
            </div>
            <div class="form-group" style="margin-top:10px;">
                <select class="form-control" id="prod-iva"><option value="21">21%</option><option value="10">10%</option><option value="4">4%</option><option value="0">0%</option></select>
            </div>
            <button class="btn-block" onclick="agregarLineaManual()">Añadir</button>
        </div>
    </div>

    <div id="modal-cliente" class="modal-mobile">
        <div class="modal-header">
            <button onclick="cerrarModalCliente()" style="background:none; border:none; font-size:20px;"><i class="fas fa-times"></i></button>
            <span style="font-weight:600;">Seleccionar Cliente</span>
        </div>
        <div class="modal-body">
            <div class="form-group"><input type="text" class="form-control" id="cliente-search" placeholder="Buscar..." oninput="buscarClientes(this.value)"></div>
            <div id="cliente-resultados"></div>
        </div>
    </div>

    <script src="/static/mobile/js/app.js"></script>
    <script src="/static/mobile/js/gestion_proformas.js"></script>
</body>
</html>
