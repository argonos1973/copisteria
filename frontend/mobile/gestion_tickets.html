<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión Ticket - Aleph70</title>
    
    <!-- Fuentes e Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Estilos Móvil -->
    <link rel="stylesheet" href="/static/mobile/css/styles.css">
</head>
<body>

    <!-- Header -->
    <header class="mobile-header">
        <div class="header-left">
            <button onclick="history.back()" style="background:none; border:none; font-size: 20px; color: var(--color-text); margin-right: 15px;">
                <i class="fas fa-arrow-left"></i>
            </button>
            <span class="header-title" id="page-title">Nuevo Ticket</span>
        </div>
        <div class="header-right">
            <button onclick="guardarTicket()" style="background:none; border:none; color: var(--color-primary); font-weight: 600;">
                Guardar
            </button>
        </div>
    </header>

    <!-- Cliente -->
    <div class="form-section">
        <div class="form-label">CLIENTE</div>
        <div class="client-selector" onclick="abrirModalCliente()">
            <div id="cliente-nombre">Cliente Contado</div>
            <i class="fas fa-chevron-right" style="color:#ccc;"></i>
        </div>
        <input type="hidden" id="cliente-id" value="1"> <!-- 1 = Genérico/Contado -->
    </div>

    <!-- Líneas -->
    <div class="form-section" style="min-height: 200px;">
        <div class="form-label">CONCEPTOS</div>
        <div id="lineas-container">
            <!-- Se llena con JS -->
            <div style="text-align:center; padding: 20px; color: #aaa;" id="empty-msg">
                Añade productos o conceptos
            </div>
        </div>
    </div>

    <!-- Totales -->
    <div class="form-section">
        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span style="color:#888;">Base Imponible</span>
            <span id="resumen-base">0,00 €</span>
        </div>
        <div style="display:flex; justify-content:space-between;">
            <span style="color:#888;">Impuestos</span>
            <span id="resumen-iva">0,00 €</span>
        </div>
    </div>

    <!-- FAB Añadir -->
    <button class="fab-add-line" onclick="abrirModalProducto()">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Footer Fijo -->
    <div class="gestion-footer">
        <div class="total-display">
            <span class="total-label">TOTAL A PAGAR</span>
            <span class="total-value" id="total-final">0,00 €</span>
        </div>
        <button class="btn-cobrar" onclick="cobrarTicket()">
            <i class="fas fa-check"></i> COBRAR
        </button>
    </div>

    <!-- MODAL PRODUCTO -->
    <div class="modal-mobile" id="modal-producto">
        <div class="modal-header">
            <button onclick="cerrarModalProducto()" style="border:none; background:none; font-size:20px;"><i class="fas fa-times"></i></button>
            <span style="font-weight:600;">Añadir Concepto</span>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label">Descripción</label>
                <input type="text" class="form-control" id="prod-desc" placeholder="Ej: Fotocopias B/N">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Cantidad</label>
                    <input type="number" class="form-control" id="prod-cant" value="1" step="1">
                </div>
                <div class="form-group" style="flex:1;">
                    <label class="form-label">Precio (€)</label>
                    <input type="number" class="form-control" id="prod-precio" value="0.00" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">IVA (%)</label>
                <select class="form-control" id="prod-iva">
                    <option value="21">21%</option>
                    <option value="10">10%</option>
                    <option value="4">4%</option>
                    <option value="0">0%</option>
                </select>
            </div>
            <button class="btn-block" onclick="agregarLineaManual()">Añadir al Ticket</button>
            
            <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
            <div style="text-align:center; color:#999; font-size:12px;">
                O busca un producto existente (Próximamente)
            </div>
        </div>
    </div>

    <script src="/static/mobile/js/app.js"></script>
    <script type="module" src="/static/mobile/js/gestion_tickets.js"></script>
</body>
</html>
